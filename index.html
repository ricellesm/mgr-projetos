<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGR Projetos</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --ink: #1d2433; --muted: #6b7280; --line: #e5e7eb; --surface: #fff; --canvas: #f4f6fa;
    --primary: #2a78d6; --primary-soft: #e8f1fc; --navy: #16213a;
    --good: #0f8a4f; --good-soft: #e3f5ec; --warn: #b77700; --warn-soft: #fff4dc;
    --bad: #c4314b; --bad-soft: #fde8ec; --series-1: #2a78d6; --series-2: #1baf7a; --pdf: #d63031;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: var(--canvas); font-size: 14px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--primary); }
  .app { display: flex; min-height: 100vh; }
  nav.side { width: 220px; background: var(--navy); color: #cfd6e6; padding: 18px 12px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; transition: width .15s; }
  nav.side h1 { color: #fff; font-size: 17px; margin: 4px 8px 2px; white-space: nowrap; }
  nav.side .sub { font-size: 12px; margin: 0 8px 22px; color: #8d97ad; white-space: nowrap; }
  nav.side button { display: flex; gap: 10px; width: 100%; text-align: left; background: none; border: 0; color: inherit; padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; white-space: nowrap; }
  nav.side button:hover { background: #22304f; }
  nav.side button.active { background: var(--primary); color: #fff; font-weight: 600; }
  nav.side .collapse { margin-top: 18px; color: #8d97ad; font-size: 12px; }
  .app.compact nav.side { width: 64px; }
  .app.compact nav.side h1, .app.compact nav.side .sub, .app.compact nav.side .lbl { display: none; }
  main { flex: 1; padding: 24px 28px; min-width: 0; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .head h2 { margin: 0; font-size: 22px; }
  .head .desc { color: var(--muted); margin-top: 4px; }
  .head .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: #f3f4f6; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #1f66bd; }
  .btn.pdf { background: var(--pdf); border-color: var(--pdf); color: #fff; font-weight: 600; }
  .btn.pdf:hover { background: #b92627; }
  .btn.xls { background: #1d7a45; border-color: #1d7a45; color: #fff; font-weight: 600; }
  .btn.orange { background: #e07b00; border-color: #e07b00; color: #fff; font-weight: 600; }
  .btn.danger { color: var(--bad); }
  .btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
  .btn:disabled { opacity: .4; cursor: default; }
  .link { background: none; border: 0; color: var(--primary); cursor: pointer; padding: 0; font-size: 13px; }
  .link.red { color: var(--bad); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .grid { display: grid; gap: 14px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 14px; }
  .kpi .lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .kpi .val { font-size: 21px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .kpi .note { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .kpi.center { text-align: center; }
  .kpi.red { border-color: #f3b9c3; } .kpi.red .val { color: var(--bad); }
  .two { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); margin-bottom: 14px; }
  .card h3 { margin: 0 0 12px; font-size: 15px; }
  .bars .row { display: grid; grid-template-columns: 170px 1fr 120px; gap: 10px; align-items: center; padding: 5px 0; }
  .bars .name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars .track { height: 14px; }
  .bars .fill { height: 14px; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; }
  .bars .num { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .bars .num b { color: var(--ink); font-weight: 600; }
  .bars .row:hover .fill { filter: brightness(.9); }
  .vchart { display: flex; align-items: flex-end; gap: 10px; height: 220px; padding: 8px 4px 0; border-bottom: 1px solid #cfd4dc; overflow-x: auto; }
  .vchart .col { flex: 1 0 48px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
  .vchart .stack { width: 70%; max-width: 46px; display: flex; flex-direction: column-reverse; gap: 2px; }
  .vchart .seg { border-radius: 0; }
  .vchart .seg:last-child { border-radius: 4px 4px 0 0; }
  .vchart .col:hover .seg { filter: brightness(.9); }
  .vchart .v { font-size: 11px; color: var(--muted); margin-bottom: 4px; white-space: nowrap; }
  .vlabels { display: flex; gap: 10px; padding: 6px 4px 0; overflow-x: hidden; }
  .vlabels span { flex: 1 0 48px; text-align: center; font-size: 11px; color: var(--muted); }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .muted { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .chip.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .chip .c { opacity: .7; margin-left: 4px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .filters input, .filters select, .fbox input, .fbox select { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: #fff; }
  .filters input.search { min-width: 280px; flex: 1; }
  .fbox { margin-bottom: 14px; }
  .fbox .ft { font-size: 12px; font-weight: 700; color: #4b5563; text-transform: uppercase; letter-spacing: .04em; margin: 12px 0 8px; }
  .fbox .ft:first-child { margin-top: 0; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .checks label { display: flex; gap: 6px; align-items: center; cursor: pointer; font-size: 14px; }
  .seg-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg-btns button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 16px; cursor: pointer; }
  .seg-btns button.on { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
  .tbl-wrap { overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .tbl-wrap.tall { max-height: calc(100vh - 260px); }
  .tbl-title { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); background: #fff; position: sticky; left: 0; }
  .tbl-title h3 { margin: 0; font-size: 15px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: #fafbfc; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr:hover > td { background: #fafcff; }
  tr.grp td { background: #eef3fb; font-weight: 700; }
  tr.sub td { background: #f8fafc; font-weight: 600; color: #374151; }
  tr.late td { background: #fff1f3; } tr.soon td { background: #fffbe6; }
  tr.recv td { color: var(--muted); }
  td .t { font-weight: 600; }
  td .s { color: var(--muted); font-size: 12px; }
  td .ob { color: #b45309; font-size: 12px; font-style: italic; }
  .nowrap { white-space: nowrap; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .badge.plain::before { display: none; }
  .st-planejado { background: #eef0f4; color: #4b5563; }
  .st-paralisado { background: var(--warn-soft); color: var(--warn); }
  .st-em_execucao { background: var(--primary-soft); color: #1d5fae; }
  .st-em_verificacao { background: #efeafd; color: #5641c4; }
  .st-emitido_concluido { background: #e0f4f6; color: #0b7285; }
  .st-medido_faturado { background: var(--good-soft); color: var(--good); }
  .st-cancelado { background: var(--bad-soft); color: var(--bad); }
  .pay-late { background: var(--bad-soft); color: var(--bad); } .pay-ok { background: var(--good-soft); color: var(--good); }
  .pay-soon { background: var(--warn-soft); color: var(--warn); } .pay-pend { background: #eef0f4; color: #4b5563; }
  .zero { color: var(--bad); font-weight: 600; }
  .prog { width: 60px; height: 6px; background: #eceef2; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .prog i { display: block; height: 6px; background: var(--primary); }
  .actions { display: flex; gap: 4px; justify-content: flex-end; }
  .sub-docs { background: #f9fafc; padding: 6px 10px 12px 34px !important; }
  .sub-docs table th { background: #f1f4f8; position: static; }
  .sub-docs table td { background: #fff; }
  .sub-docs select, .cell-in { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: #fff; font-size: 12px; }
  .colpick { position: relative; }
  .colpick .menu { position: absolute; right: 0; top: 38px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 10px 14px; z-index: 20; min-width: 200px; }
  .colpick .menu label { display: flex; gap: 8px; padding: 3px 0; font-size: 13px; cursor: pointer; }
  /* modal */
  .ov { position: fixed; inset: 0; background: rgba(15, 23, 42, .5); display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow-y: auto; z-index: 50; }
  .modal { background: #fff; border-radius: 14px; width: 100%; max-width: 1280px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal.full { max-width: 99vw; }
  .modal.small { max-width: 480px; }
  .modal .mh { display: flex; justify-content: space-between; align-items: center; padding: 14px 22px; border-bottom: 1px solid var(--line); gap: 8px; }
  .modal .mh h3 { margin: 0; font-size: 17px; }
  .modal .mb { padding: 18px 22px; }
  .modal .mf { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; position: sticky; bottom: 0; background: #fff; border-radius: 0 0 14px 14px; }
  .sec { margin-bottom: 18px; }
  .sec > h4 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .fg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .fg .span2 { grid-column: span 2; } .fg .span4 { grid-column: span 4; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: #4b5563; }
  label.f input, label.f select, label.f textarea, .doc-tbl input, .doc-tbl select { border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font-weight: 400; background: #fff; width: 100%; font-size: 13px; }
  .err { border-color: var(--bad) !important; }
  .doc-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  .doc-tbl { min-width: 1500px; }
  .doc-tbl td, .doc-tbl th { padding: 5px 4px; }
  .doc-tbl th { position: static; }
  .doc-tbl tr:hover td { background: none; }
  .total-box { display: flex; justify-content: flex-end; gap: 22px; font-size: 14px; }
  .total-box b { color: var(--primary); font-size: 16px; }
  .stages { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; }
  .stages label { display: flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }
  .info { background: var(--primary-soft); color: #1d4f8f; border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.6; }
  .warn-box { background: var(--warn-soft); color: #7a4f00; border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  .toast { position: fixed; bottom: 22px; right: 22px; background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 10px; z-index: 99; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .empty { text-align: center; padding: 34px; color: var(--muted); }
  .backup-grid { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .backup-grid .card p { color: var(--muted); margin: 0 0 14px; line-height: 1.5; }
  .backup-grid .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  /* mapa de carga */
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
  .panel > .ph { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font-weight: 700; }
  .panel.queue > .ph { background: #fff8e8; }
  .panel.seq > .ph { background: #eef4fd; }
  .stage-chk { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 12px; color: #4b5563; margin-top: 4px; cursor: pointer; background: #fff; }
  .cad { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .gantt { overflow-x: auto; }
  .gantt table { border-collapse: collapse; }
  .gantt th, .gantt td { border-bottom: 1px solid var(--line); padding: 0; }
  .gantt .lbl { min-width: 280px; max-width: 280px; padding: 8px 12px; position: sticky; left: 0; background: #fff; z-index: 2; border-right: 1px solid var(--line); }
  .gantt th.lbl { background: #fafbfc; z-index: 3; }
  .gantt .day { width: 34px; min-width: 34px; text-align: center; font-size: 10px; color: var(--muted); border-left: 1px solid #f0f1f4; }
  .gantt .day.we { background: #f7f8fa; }
  .gantt .day.today { background: #fff4dc; color: var(--warn); font-weight: 700; }
  .gantt .mon { font-size: 11px; text-align: left; padding: 4px 6px; color: var(--ink); border-left: 1px solid #e3e6eb; }
  .gantt td.track { position: relative; height: 54px; }
  .gantt .bar { position: absolute; top: 14px; height: 26px; background: var(--series-1); color: #fff; border-radius: 5px; font-size: 12px; font-weight: 600; padding: 5px 8px; white-space: nowrap; overflow: hidden; }
  .seqno { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff; font-weight: 700; font-size: 12px; margin-right: 8px; flex-shrink: 0; }
  .reorder { display: flex; flex-direction: column; gap: 8px; padding: 0 16px 16px; }
  .reorder .it { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .reorder .it[draggable] { cursor: grab; }
  .reorder .it.drag { opacity: .5; }
  .reorder .grow { flex: 1; min-width: 0; }
  /* login / sincronização */
  #auth { position: fixed; inset: 0; background: linear-gradient(135deg, #16213a, #1f3b6e); display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
  #auth.on { display: flex; }
  #auth .box { background: #fff; border-radius: 16px; width: 100%; max-width: 400px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  #auth h1 { margin: 0 0 4px; font-size: 24px; }
  #auth .sub { color: var(--muted); margin-bottom: 20px; }
  #auth label.f { margin-bottom: 12px; }
  #auth .btn { width: 100%; padding: 10px; margin-top: 4px; }
  #auth .links { display: flex; justify-content: space-between; margin-top: 14px; }
  #auth .msg { margin-top: 14px; font-size: 13px; line-height: 1.5; border-radius: 8px; padding: 10px 12px; display: none; }
  #auth .msg.on { display: block; } #auth .msg.err { background: var(--bad-soft); color: var(--bad); } #auth .msg.ok { background: var(--good-soft); color: var(--good); }
  .userbox { margin-top: 18px; padding: 12px; border-top: 1px solid #2a3756; font-size: 12px; color: #8d97ad; }
  .userbox .em { color: #cfd6e6; word-break: break-all; margin-bottom: 6px; }
  .userbox .sync { margin-bottom: 8px; } .userbox .sync.err { color: #ff9aa8; } .userbox .sync.ok { color: #7ee2b0; }
  .userbox button { display: inline; width: auto; padding: 0; margin-right: 12px; color: #9fb4dc; font-size: 12px; }
  .app.compact .userbox { display: none; }
  @media (max-width: 860px) {
    .app { flex-direction: column; } nav.side { width: 100% !important; height: auto; position: static; display: flex; flex-wrap: wrap; gap: 4px; }
    nav.side h1, nav.side .sub, nav.side .collapse { display: none; } nav.side button { width: auto; }
    main { padding: 16px; } .fg { grid-template-columns: 1fr 1fr; } .stages { grid-template-columns: 1fr; }
    .bars .row { grid-template-columns: 110px 1fr 100px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="side">
    <h1>MGR Projetos</h1>
    <div class="sub">Gestão de serviços externos</div>
    <button data-tab="dashboard">📊<span class="lbl">Dashboard</span></button>
    <button data-tab="servicos">🧾<span class="lbl">Serviços</span></button>
    <button data-tab="mapa">🗂️<span class="lbl">Mapa de Carga</span></button>
    <button data-tab="empresas">🏢<span class="lbl">Empresas</span></button>
    <button data-tab="relatorios">📄<span class="lbl">Relatórios</span></button>
    <button data-tab="recebimentos">📥<span class="lbl">Recebimentos</span></button>
    <button data-tab="financeiro">💲<span class="lbl">Financeiro</span></button>
    <button data-tab="backup">💾<span class="lbl">Backup</span></button>
    <button class="collapse" id="btn-compact">⇔<span class="lbl">Recolher menu</span></button>
    <div class="userbox"><div class="em" id="user-email"></div><div class="sync" id="sync-status"></div>
      <button id="btn-pass">Alterar senha</button><button id="btn-logout">Sair</button></div>
  </nav>
  <main id="main"></main>
</div>
<div id="auth"><div class="box">
  <h1>MGR Projetos</h1><div class="sub">Gestão de serviços externos — acesso restrito</div>
  <label class="f">E-mail<input id="a-email" type="email" autocomplete="username"></label>
  <label class="f">Senha<input id="a-pass" type="password" autocomplete="current-password"></label>
  <button class="btn primary" id="a-login">Entrar</button>
  <div class="links"><button class="link" id="a-signup">Primeiro acesso: criar senha</button></div>
  <div class="msg" id="a-msg"></div>
</div></div>
<div id="modal-root"></div>

<script>
/* ============================ Constantes ============================ */
const STORE_KEY = 'mgr_servicos_externos_v1';
const PREV_KEY = 'mgr_servicos_externos_prev';
const UI_KEY = 'mgr_servicos_externos_ui';
const APP_NAME = 'MGR Projetos';
const STATUS = [
  { v: 'planejado', l: 'Planejado' },
  { v: 'paralisado', l: 'Paralisado' },
  { v: 'em_execucao', l: 'Em Execução' },
  { v: 'em_verificacao', l: 'Em Verificação/Finalizado' },
  { v: 'emitido_concluido', l: 'Emitido/Concluído' },
  { v: 'medido_faturado', l: 'Medido/Faturado' },
  { v: 'cancelado', l: 'Cancelado' },
];
const RANK = { planejado: 0, paralisado: 1, em_execucao: 2, em_verificacao: 3, emitido_concluido: 4, medido_faturado: 5, cancelado: 9 };
const FLOW = ['planejado', 'em_execucao', 'em_verificacao', 'emitido_concluido', 'medido_faturado'];
const DOC_TYPES = [
  { v: 'A1_BASICO', l: 'A1 Básico', s: 'A1 Básico', field: 'a1_basico_value', unit: 'folha' },
  { v: 'A1_DETALHADO', l: 'A1 Detalhado', s: 'A1 Det.', field: 'a1_detalhado_value', unit: 'folha' },
  { v: 'HH_ENG', l: 'HH Engenheiro', s: 'HH Eng.', field: 'hh_eng_value', unit: 'h' },
  { v: 'HH_PROJ', l: 'HH Projetista', s: 'HH Proj.', field: 'hh_projetista_value', unit: 'h' },
];
/** Disciplinas padrão — novas podem ser cadastradas na aba Empresas (ficam em state.disciplines). */
const DEFAULT_DISCIPLINES = [{ code: 'ME', name: '' }, { code: 'MT', name: '' }, { code: 'EM', name: '' }];
const cleanCode = v => String(v ?? '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
/** Prefixo do nº do documento: SE-<disciplina>-<nº projeto>-MC — o restante é completado pelo criador. */
const docPrefix = s => `SE-${s.discipline || 'ME'}-${s.project_number || '0000-0000'}-MC`;

function inferDiscipline(s) {
  for (const d of s.documents || []) { const m = String(d.doc_number || '').match(/^SE-([A-Z0-9]{2,4})-\d/i); if (m) return m[1].toUpperCase(); }
  return 'ME';
}
function normalizeDisciplines(list, services) {
  const out = [];
  const add = (code, name) => { const c = cleanCode(code); if (c.length >= 2 && !out.some(x => x.code === c)) out.push({ code: c, name: String(name || '').trim() }); };
  (Array.isArray(list) && list.length ? list : DEFAULT_DISCIPLINES).forEach(x => typeof x === 'string' ? add(x) : add(x.code, x.name));
  services.forEach(s => add(s.discipline));
  return out;
}

/** Regra de medição: medição dia 25, NF até dia 5 do mês seguinte, pagamento dia 10 do mês subsequente. */
function measurementCycle(measureIso) {
  const [y, m] = measureIso.split('-').map(Number);
  return { invoice: iso(y, m, 5), payment: iso(y, m + 1, 10) }; // m é 1-based → índice m = mês seguinte
}
/** Próxima medição (dia 25) a partir de uma data: até o dia 25 entra no mês; depois, no mês seguinte. */
function nextMeasurement(baseIso) {
  const [y, m, d] = baseIso.split('-').map(Number);
  return d <= 25 ? iso(y, m - 1, 25) : iso(y, m, 25);
}
function defaultMeasurementDate() { const t = new Date(); return iso(t.getFullYear(), t.getMonth(), 25); }

function normalizeCompany(c) {
  return {
    id: c.id || uid(), name: String(c.name || '').trim(), active: c.active !== false,
    a1_basico_value: num(c.a1_basico_value), a1_detalhado_value: num(c.a1_detalhado_value),

    created_date: c.created_date || new Date().toISOString(), updated_date: c.updated_date || new Date().toISOString(),
  };
}
function normalizeDoc(d, s) {
  // Migração: backups antigos tinham o status/datas de medição no serviço
  let status = STATUS.some(x => x.v === d.status) ? d.status : null;
  if (!status) status = d.measured ? 'medido_faturado' : (STATUS.some(x => x.v === s.status) ? s.status : 'planejado');
  const doc = {
    id: d.id || uid(), doc_number: String(d.doc_number || '').trim(), note: String(d.note ?? d.doc_note ?? '').trim(),
    type: DOC_TYPES.some(t => t.v === d.type) ? d.type : 'HH_ENG', quantity: num(d.quantity), status,
    completion_date: d.completion_date || '', measurement_date: d.measurement_date || '',
    invoice_date: d.invoice_date || '', payment_date: d.payment_date || '',
    received: !!d.received, received_date: d.received_date || '',
    exec_start: d.exec_start || '', exec_end: d.exec_end || '',
    priority: d.priority == null || d.priority === '' ? null : num(d.priority), substatus: d.substatus || '',
  };
  if (status === 'medido_faturado') {
    if (!doc.measurement_date) doc.measurement_date = s.measurement_date || '';
    if (!doc.invoice_date) doc.invoice_date = s.invoice_date || '';
    if (!doc.payment_date) doc.payment_date = s.payment_date || '';
    if (doc.measurement_date) {
      const cyc = measurementCycle(doc.measurement_date);
      if (!doc.invoice_date) doc.invoice_date = cyc.invoice;
      if (!doc.payment_date) doc.payment_date = cyc.payment;
    }
  }
  doc.measured = status === 'medido_faturado';
  return doc;
}
function normalizeService(s) {
  const svc = {
    id: s.id || uid(), project_number: String(s.project_number || '').trim(), parent_project: String(s.parent_project || '').trim(),
    title: String(s.title || '').trim(), company_id: s.company_id || '', company_name: s.company_name || '',
    discipline: cleanCode(s.discipline).length >= 2 ? cleanCode(s.discipline) : inferDiscipline(s),
    start_date: s.start_date || '', completion_date: s.completion_date || '', concluded_date: s.concluded_date || '',
    progress_percentage: Math.max(0, Math.min(100, num(s.progress_percentage))), notes: s.notes || '',
    stages: Array.isArray(s.stages) && s.stages.length ? s.stages : structuredClone(DEFAULT_STAGES),
    created_date: s.created_date || new Date().toISOString(), updated_date: s.updated_date || new Date().toISOString(),
  };
  svc.documents = (s.documents || []).map(d => normalizeDoc(d, s));
  if (!svc.concluded_date && ['emitido_concluido', 'medido_faturado'].includes(serviceStatus(svc))) {
    const ds = svc.documents.map(d => d.completion_date).filter(Boolean).sort();
    if (ds.length) svc.concluded_date = ds[ds.length - 1];
  }
  return svc;
}
function normalizeState(d) {
  const companies = (d.companies || []).map(normalizeCompany);
  const services = (d.services || []).map(normalizeService);
  services.forEach(s => {
    let c = companies.find(c => c.id === s.company_id);
    if (!c && s.company_name) c = companies.find(c => norm(c.name) === norm(s.company_name));
    if (c) { s.company_id = c.id; s.company_name = c.name; }

}

/* ============================ Cálculos ============================ */
const companyOf = s => state.companies.find(c => c.id === s.company_id);
function unitValue(company, type) { return company ? num(company[typeInfo(type).field]) : 0; }
function docValue(s, d) { return num(d.quantity) * unitValue(companyOf(s), d.type); }
function serviceValue(s) { return s.documents.reduce((a, d) => a + docValue(s, d), 0); }
function serviceQty(s, type) { return s.documents.filter(d => !type || d.type === type).reduce((a, d) => a + num(d.quantity), 0); }
/** Status resumido do serviço = documento menos avançado (ignorando cancelados). */
function serviceStatus(s) {
  const ds = s.documents.filter(d => d.status !== 'cancelado');
  if (!s.documents.length) return 'planejado';
  if (!ds.length) return 'cancelado';
  return ds.reduce((a, d) => RANK[d.status] < RANK[a] ? d.status : a, 'medido_faturado');
}
function allDocs() { return state.services.flatMap(s => s.documents.map(d => ({ s, d, value: docValue(s, d) }))); }
/** Data de pagamento salva ou estimada pelo ciclo (emitido: próxima medição a partir da conclusão). */
function paymentInfo(s, d) {
  if (d.payment_date) return { date: d.payment_date, est: false, ref: d.measurement_date };
  if (d.status === 'medido_faturado' && d.measurement_date) return { date: measurementCycle(d.measurement_date).payment, est: true, ref: d.measurement_date };
  if (d.status === 'emitido_concluido') {
    const base = d.completion_date || s.concluded_date || todayIso();
    const meas = nextMeasurement(base);
    return { date: measurementCycle(meas).payment, est: true, ref: base, meas };
  }
  return { date: '', est: true, ref: '' };
}
function payState(d, date) {
  if (d.received) return { k: 'ok', l: 'Recebido' };
  if (!date) return { k: 'pend', l: '—' };
  const diff = daysBetween(todayIso(), date);
  if (diff < 0) return { k: 'late', l: 'Atrasado' };
  if (diff <= 30) return { k: 'soon', l: `Vence em ${diff}d` };
  return { k: 'pend', l: 'Pendente' };
}
function nextStage(s) { return s.stages.find(st => !st.completed); }

function setDocStatus(s, d, st, after) {
  if (st === 'medido_faturado') {
    askMeasurement([{ s, d }], ok => { if (ok) { touch(s); save(); toast('Documento medido/faturado'); } (after || render)(); });
    return;
  }
  applyStatus(s, d, st); touch(s); save(); (after || render)();
}
function applyStatus(s, d, st) {
  d.status = st; d.measured = st === 'medido_faturado';
  if (st !== 'medido_faturado') { d.measurement_date = ''; d.invoice_date = ''; d.payment_date = ''; d.received = false; d.received_date = ''; }
  if (st === 'emitido_concluido' && !d.completion_date) d.completion_date = todayIso();
  if (st === 'em_execucao' && !s.start_date) s.start_date = todayIso();
  rollup(s);
}
/** Serviço inteiro emitido/medido → avanço 100% e data de conclusão. */
function rollup(s) {
  const stS = serviceStatus(s);
  if (['emitido_concluido', 'medido_faturado'].includes(stS)) { s.progress_percentage = 100; if (!s.concluded_date) s.concluded_date = s.documents.map(x => x.completion_date).filter(Boolean).sort().at(-1) || todayIso(); }
}

function bindServiceModal() {
  const root = document.getElementById('modal-root');
  root.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
  root.querySelector('[data-full]').onclick = () => { draftFull = !draftFull; renderServiceModal(); };
  root.querySelectorAll('[data-f]').forEach(el => {
    el.oninput = el.onchange = () => {
      const k = el.dataset.f;
      let v = el.value;
      if (k === 'progress_percentage') { v = +v; document.getElementById('m-progv').textContent = v + '%'; }
      if (k === 'discipline' && v === '__new__') {
        const code = addDiscipline();
        if (!code) { el.value = draft.discipline; return; }
        v = code;
      }
      const oldPrefix = docPrefix(draft);
      draft[k] = v;
      if (k === 'project_number' || k === 'discipline') {
        // atualiza nº de documentos ainda não editados (vazios ou só com o prefixo antigo)
        const np = docPrefix(draft);
        draft.documents.forEach((d, i) => {
          if (!d.doc_number || d.doc_number === oldPrefix) {
            d.doc_number = draft.project_number ? np : '';
            const inp = root.querySelector(`[data-d="${i}"][data-k="doc_number"]`); if (inp) inp.value = d.doc_number;
          }
        });
        root.querySelectorAll('[data-k="doc_number"]').forEach(inp => inp.placeholder = np + '001-001-R00');
        if (k === 'discipline' && el.value !== v) renderServiceModal(); // nova disciplina criada: recarrega a lista
      }
      if (k === 'company_id') { draft.company_name = companyOf(draft)?.name || ''; renderServiceModal(); }
    };
  });
  root.querySelectorAll('[data-d]').forEach(el => {
    const handler = e => {
      const d = draft.documents[+el.dataset.d], k = el.dataset.k;
      if (k === 'status') {
        if (e.type !== 'change') return;
        if (el.value === 'medido_faturado') { askMeasurement([{ s: draft, d }], () => renderServiceModal()); return; }
        applyStatus(draft, d, el.value); renderServiceModal(); return;
      }
      if (k === 'received') { d.received = el.checked; d.received_date = el.checked ? (d.received_date || todayIso()) : ''; return; }
      d[k] = k === 'quantity' ? num(el.value) : el.value;
      if (k === 'measurement_date' && e.type === 'change' && el.value) { const c = measurementCycle(el.value); d.invoice_date = c.invoice; d.payment_date = c.payment; renderServiceModal(); return; }
      if (k === 'type') renderServiceModal(); else if (k === 'quantity') refreshTotals();
    };
    el.oninput = handler; el.onchange = handler;
  });
  root.querySelectorAll('[data-stage]').forEach(el => el.onchange = () => {
    draft.stages[+el.dataset.stage].completed = el.checked;
    draft.progress_percentage = Math.round(draft.stages.filter(s => s.completed).length / draft.stages.length * 100);
    renderServiceModal();
  });
  root.querySelector('[data-adddoc]').onclick = () => {
    const last = draft.documents.at(-1);
    draft.documents.push(normalizeDoc({ doc_number: draft.project_number ? docPrefix(draft) : '', type: last?.type || 'HH_ENG', status: last && last.status !== 'medido_faturado' ? last.status : 'planejado' }, {}));
    renderServiceModal();
    const inp = document.querySelector(`#modal-root [data-d="${draft.documents.length - 1}"][data-k="doc_number"]`);
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  };
  const me = root.querySelector('[data-measemit]');
  if (me) me.onclick = () => askMeasurement(draft.documents.filter(d => d.status === 'emitido_concluido').map(d => ({ s: draft, d })), () => renderServiceModal());
  root.querySelectorAll('[data-deldoc]').forEach(b => b.onclick = () => { draft.documents.splice(+b.dataset.deldoc, 1); renderServiceModal(); });
  root.querySelector('[data-save]').onclick = saveDraft;
}
function saveDraft() {
  const docsOk = draft.documents.filter(d => d.doc_number || d.quantity || d.note);
  if (!draft.company_id && docsOk.some(d => d.status !== 'cancelado')) return alert('Selecione a empresa.');
  if (docsOk.some(d => d.status === 'medido_faturado' && !d.measurement_date)) return alert('Informe a data de medição dos documentos Medido/Faturado.');
  if (!draft.project_number && !draft.title) return alert('Informe o nº do projeto ou título.');
  const s = structuredClone(draft); delete s._isNew;
  s.documents = s.documents.filter(d => d.doc_number || d.quantity || d.note);
  s.documents.forEach(d => d.measured = d.status === 'medido_faturado');
  touch(s);
  const i = state.services.findIndex(x => x.id === s.id);
  if (i >= 0) state.services[i] = s; else state.services.push(s);
  save(); closeModal(); render(); toast('Serviço salvo');
}
/** Modal de medição — obrigatório ao marcar Medido/Faturado. items = [{s, d}] */
function askMeasurement(items, done) {
  const d0 = items.find(x => x.d.measurement_date)?.d.measurement_date || defaultMeasurementDate();
  const holder = document.createElement('div');
  holder.className = 'ov'; holder.style.zIndex = 60;
  const total = items.reduce((a, x) => a + docValue(x.s, x.d), 0);
  holder.innerHTML = `<div class="modal small"><div class="mh"><h3>Marcar como Medido/Faturado</h3></div><div class="mb">
    <div class="sec"><div class="muted" style="margin-bottom:10px">${items.length === 1 ? `${esc(items[0].s.project_number)} — ${esc(items[0].d.doc_number)}` : `${items.length} documentos`}<br>Valor: <b style="color:var(--ink)">${brl(total)}</b></div>
    <div class="fg" style="grid-template-columns:1fr">
      <label class="f">Data de medição * (padrão dia 25)<input type="date" id="q-meas" value="${d0}"></label>
      <label class="f">NF emitida até (dia 5 do mês seguinte)<input type="date" id="q-inv"></label>
      <label class="f">Pagamento previsto (dia 10 do mês subsequente)<input type="date" id="q-pay"></label>
    </div></div></div>
    <div class="mf"><button class="btn" id="q-cancel">Cancelar</button><button class="btn primary" id="q-ok">Confirmar medição</button></div></div>`;
  document.body.appendChild(holder);
  const paint = d => { const c = d ? measurementCycle(d) : null; holder.querySelector('#q-inv').value = c ? c.invoice : ''; holder.querySelector('#q-pay').value = c ? c.payment : ''; };
  paint(d0);
  holder.querySelector('#q-meas').onchange = e => paint(e.target.value);
  holder.querySelector('#q-cancel').onclick = () => { holder.remove(); done(false); };
  holder.querySelector('#q-ok').onclick = () => {
    const m = holder.querySelector('#q-meas').value;
    if (!m) return alert('Informe a data de medição.');
    const inv = holder.querySelector('#q-inv').value, pay = holder.querySelector('#q-pay').value;
    items.forEach(({ s, d }) => {
      applyStatus(s, d, 'medido_faturado');
      Object.assign(d, { measurement_date: m, invoice_date: inv, payment_date: pay, measured: true });
      if (!d.completion_date) d.completion_date = m;
    });
    items.forEach(({ s }) => rollup(s));
    holder.remove(); done(true);
  };
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; draft = null; }

function mapaDocs() {
  const M = ui.mapa, q = norm(M.search);
  return allDocs().filter(({ s, d }) => {
    if (M.statuses.size && !M.statuses.has(d.status)) return false;
    if (M.types.size && !M.types.has(d.type)) return false;
    if (q && !norm([s.project_number, s.title, s.company_name, d.doc_number, d.note].join(' ')).includes(q)) return false;
    if (M.from && (d.exec_end || s.completion_date || '9999') < M.from) return false;
    if (M.to && (d.exec_start || s.start_date || '0000') > M.to) return false;
    return true;
  });
}
function renumber() {
  allDocs().filter(x => x.d.priority != null).sort((a, b) => a.d.priority - b.d.priority).forEach((x, i) => x.d.priority = i + 1);
}
function findDoc(key) { const [sid, did] = key.split('|'); const s = state.services.find(x => x.id === sid); return { s, d: s?.documents.find(x => x.id === did) }; }

function ganttHtml(seq) {
  const today = todayIso();
  const starts = seq.map(x => x.d.exec_start || x.s.start_date).filter(Boolean), ends = seq.map(x => x.d.exec_end || x.s.completion_date).filter(Boolean);
  let a = [...starts, today].sort()[0], b = [...ends, addDaysIso(today, 14)].sort().at(-1);
  if (ui.mapa.from) a = ui.mapa.from; if (ui.mapa.to) b = ui.mapa.to;
  a = addDaysIso(a, -1);
  const n = Math.min(daysBetween(a, b) + 2, 400);
  const days = Array.from({ length: n }, (_, i) => addDaysIso(a, i));
  const months = []; days.forEach(d => { const k = d.slice(0, 7); if (!months.length || months.at(-1).k !== k) months.push({ k, n: 0 }); months.at(-1).n++; });
  const W = 34;
  return `<div class="gantt"><table>
    <thead><tr><th class="lbl" rowspan="2">Documento</th>${months.map(m => `<th class="mon" colspan="${m.n}">${monthLabel(m.k)}</th>`).join('')}</tr>
    <tr>${days.map(d => { const wd = new Date(d + 'T00:00').getDay(); return `<th class="day ${wd === 0 || wd === 6 ? 'we' : ''} ${d === today ? 'today' : ''}">${+d.slice(8)}</th>`; }).join('')}</tr></thead>
    <tbody>${seq.map(x => {
      const st = x.d.exec_start || x.s.start_date, en = x.d.exec_end || x.s.completion_date || st;
      let bar = '';
      if (st) {
        const off = Math.max(0, daysBetween(a, st)), len = Math.max(1, daysBetween(st, en) + 1);
        bar = `<div class="bar" style="left:${off * W}px;width:${Math.min(len, n - off) * W - 4}px" title="${esc(x.d.doc_number)}: ${fmtD(st)} a ${fmtD(en)}${x.d.exec_start ? '' : ' (datas do cadastro)'}">${typeInfo(x.d.type).s} · ${fmtN(x.d.quantity)}</div>`;
      }
      return `<tr><td class="lbl"><div style="display:flex;align-items:center"><span class="seqno">${x.d.priority}</span><div><a href="#" data-edit="${x.s.id}" class="t" style="font-size:13px">${esc(x.d.doc_number) || '—'}</a><div class="s">${esc(x.s.project_number)}</div>${x.d.note ? `<div class="ob" style="font-style:normal;text-transform:uppercase;font-size:11px">${esc(x.d.note)}</div>` : ''}</div></div></td>
        <td class="track" colspan="${n}" style="min-width:${n * W}px">${bar || '<span class="s" style="padding-left:10px">sem datas</span>'}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}
function bindMapa(m) {
  const M = ui.mapa;
  const s1 = m.querySelector('#m-search'); if (s1) s1.oninput = () => { M.search = s1.value; const p = s1.selectionStart; render(); const n = document.getElementById('m-search'); n.focus(); n.setSelectionRange(p, p); };
  m.querySelectorAll('#m-from,#m-to').forEach(el => el.onchange = () => { M[el.id === 'm-from' ? 'from' : 'to'] = el.value; render(); });
  m.querySelectorAll('[data-mview]').forEach(b => b.onclick = () => { M.view = b.dataset.mview; render(); });
  m.querySelectorAll('[data-mst]').forEach(b => b.onclick = () => { M.statuses.has(b.dataset.mst) ? M.statuses.delete(b.dataset.mst) : M.statuses.add(b.dataset.mst); render(); });
  m.querySelectorAll('[data-mty]').forEach(b => b.onclick = () => { M.types.has(b.dataset.mty) ? M.types.delete(b.dataset.mty) : M.types.add(b.dataset.mty); render(); });
  const persist = s => { touch(s); save(); render(); };
  m.querySelectorAll('[data-exec]').forEach(el => el.onchange = () => { const [sid, did, k] = el.dataset.exec.split('|'); const { s, d } = findDoc(sid + '|' + did); d[k] = el.value; persist(s); });
  m.querySelectorAll('[data-sub]').forEach(el => el.onchange = () => { const { s, d } = findDoc(el.dataset.sub); d.substatus = el.value; persist(s); });
  m.querySelectorAll('[data-mstatus]').forEach(el => el.onchange = () => { const { s, d } = findDoc(el.dataset.mstatus); setDocStatus(s, d, el.value); });
  m.querySelectorAll('[data-stagedone]').forEach(el => el.onchange = () => {
    const { s } = findDoc(el.dataset.stagedone); const st = nextStage(s); if (!st) return;
    st.completed = true; s.progress_percentage = Math.round(s.stages.filter(x => x.completed).length / s.stages.length * 100); persist(s);
  });
  const maxPrio = () => Math.max(0, ...allDocs().map(x => x.d.priority || 0));
  m.querySelectorAll('[data-prio]').forEach(b => b.onclick = () => { const { s, d } = findDoc(b.dataset.prio); d.priority = maxPrio() + 1; persist(s); });
  m.querySelectorAll('[data-unprio]').forEach(b => b.onclick = () => { const { s, d } = findDoc(b.dataset.unprio); d.priority = null; renumber(); persist(s); });
  const move = (k, dir) => {
    const seq = allDocs().filter(x => x.d.priority != null).sort((a, b) => a.d.priority - b.d.priority);
    const visible = mapaDocs().map(x => x.d);
    const vis = seq.filter(x => visible.includes(x.d));
    const i = vis.findIndex(x => `${x.s.id}|${x.d.id}` === k), j = i + dir;
    if (j < 0 || j >= vis.length) return;
    [vis[i].d.priority, vis[j].d.priority] = [vis[j].d.priority, vis[i].d.priority];
    save(); render();
  };
  m.querySelectorAll('[data-up]').forEach(b => b.onclick = () => move(b.dataset.up, -1));
  m.querySelectorAll('[data-down]').forEach(b => b.onclick = () => move(b.dataset.down, 1));
  let dragKey = null;
  m.querySelectorAll('[data-drag]').forEach(it => {
    it.ondragstart = () => { dragKey = it.dataset.drag; it.classList.add('drag'); };
    it.ondragend = () => it.classList.remove('drag');
    it.ondragover = e => e.preventDefault();
    it.ondrop = e => {
      e.preventDefault(); if (!dragKey || dragKey === it.dataset.drag) return;
      const seq = allDocs().filter(x => x.d.priority != null).sort((a, b) => a.d.priority - b.d.priority);
      const from = seq.findIndex(x => `${x.s.id}|${x.d.id}` === dragKey), to = seq.findIndex(x => `${x.s.id}|${x.d.id}` === it.dataset.drag);
      const [mv] = seq.splice(from, 1); seq.splice(to, 0, mv); seq.forEach((x, i) => x.d.priority = i + 1);
      save(); render();
    };
  });
}

const REP_TYPES = [{ v: 'geral', l: 'Geral' }, { v: 'empresa', l: 'Por Empresa' }, { v: 'projeto', l: 'Por Projeto' }, { v: 'empresa_projeto', l: 'Empresa + Projeto' }];
function reportData() {
  const R = ui.rep, df = REP_DATES.find(x => x.v === R.dateField);
  const rows = allDocs().filter(x => {
    if (!R.statuses.has(x.d.status)) return false;

    if (R.from && (!dv || dv < R.from)) return false;

  }).sort((a, b) => {

  });
  const sum = arr => arr.reduce((a, x) => a + x.value, 0);
  const qty = (arr, pre) => arr.filter(x => x.d.type.startsWith(pre)).reduce((a, x) => a + num(x.d.quantity), 0);
  const med = rows.filter(x => x.d.status === 'medido_faturado');
  const kpis = {
    projetos: new Set(rows.map(x => x.s.project_number || x.s.id)).size, documentos: rows.length, a1: qty(rows, 'A1'), hh: qty(rows, 'HH'),
    total: sum(rows), medido: sum(med), faturar: sum(rows.filter(x => !['medido_faturado', 'cancelado'].includes(x.d.status))),
  };
  // agrupamento
  const groupsOf = x => R.type === 'empresa' ? [x.s.company_name || '(sem empresa)'] : R.type === 'projeto' ? [x.s.project_number + (x.s.title ? ' — ' + x.s.title : '')]
    : R.type === 'empresa_projeto' ? [x.s.company_name || '(sem empresa)', x.s.project_number + (x.s.title ? ' — ' + x.s.title : '')] : [];
  const title = 'Relatório ' + (R.type === 'geral' ? 'Geral' : REP_TYPES.find(t => t.v === R.type).l.replace('Por ', 'por '));
  return { rows, kpis, groupsOf, title, sum };

const REP_COLS = ['Projeto', 'Documento', 'Observação', 'Avanço', 'Empresa', 'Tipo', 'Status', 'Qtd', 'Valor', 'Dt. Início', 'Dt. Concl. Prev.', 'Concl. Doc.', 'Dt. Medição', 'Dt. Pagamento'];
const repCells = x => [x.s.project_number, x.d.doc_number, x.d.note, x.s.progress_percentage + '%', x.s.company_name, typeInfo(x.d.type).s, statusLabel(x.d.status), fmtN(x.d.quantity), brl(x.value),
  fmtD(x.s.start_date), fmtD(x.s.completion_date), fmtD(x.d.completion_date), fmtD(x.d.measurement_date), fmtD(x.d.payment_date)];
/** Linhas com cabeçalhos/subtotais de grupo: [{kind:'grp'|'sub'|'row', level, label, x, items}] */
function groupedLines(rows, groupsOf, sum) {
  const out = []; let cur = [];
  const flush = (lvl, label, items) => out.push({ kind: 'sub', level: lvl, label, items });
  if (!rows.length || !groupsOf(rows[0]).length) return rows.map(x => ({ kind: 'row', x }));
  const depth = groupsOf(rows[0]).length;
  let open = Array(depth).fill(null), buckets = Array.from({ length: depth }, () => []);
  rows.forEach(x => {
    const g = groupsOf(x);
    for (let l = 0; l < depth; l++) {
      if (g[l] !== open[l]) {
        for (let k = depth - 1; k >= l; k--) if (open[k] !== null) { flush(k, open[k], buckets[k]); buckets[k] = []; }
        for (let k = l; k < depth; k++) { open[k] = g[k]; out.push({ kind: 'grp', level: k, label: g[k] }); }
        break;
      }
    }
    out.push({ kind: 'row', x }); buckets.forEach(b => b.push(x));
  });
  for (let k = depth - 1; k >= 0; k--) flush(k, open[k], buckets[k]);
  return out;
}

/* ---------- Gerador de PDF (padrão dos relatórios) ---------- */
function pdfDoc({ title, filename, summary, filters, kpis, head, body, colStyles, rowStyle }) {
  if (!window.jspdf) return alert('Biblioteca de PDF não carregou (sem internet?).');
  const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  const W = doc.internal.pageSize.getWidth(), M = 10;
  const header = () => {
    doc.setFillColor(22, 33, 58); doc.rect(0, 0, W, 14, 'F');
    doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text(APP_NAME, M, 9.2);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.text(title, W - M, 9.2, { align: 'right' });
  };
  header();
  doc.setTextColor(29, 36, 51); doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.text(title, M, 24);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(107, 114, 128);
  doc.text('Gerado em: ' + new Date().toLocaleString('pt-BR'), W - M, 24, { align: 'right' });
  let y = 30;
  if (summary) { doc.text(summary, M, y); y += 5; }
  if (filters) { doc.text(doc.splitTextToSize('Filtros: ' + filters, W - 2 * M), M, y); y += 5; }
  if (kpis?.length) {
    const gap = 3, bw = (W - 2 * M - gap * (kpis.length - 1)) / kpis.length;
    kpis.forEach(([l, v], i) => {
      const x = M + i * (bw + gap);
      doc.setDrawColor(229, 231, 235); doc.setFillColor(248, 250, 252); doc.roundedRect(x, y, bw, 15, 2, 2, 'FD');
      doc.setFontSize(7.5); doc.setTextColor(107, 114, 128); doc.text(String(l).toUpperCase(), x + bw / 2, y + 5.5, { align: 'center' });
      doc.setFontSize(11); doc.setFont('helvetica', 'bold'); doc.setTextColor(29, 36, 51); doc.text(String(v), x + bw / 2, y + 11.5, { align: 'center' });
      doc.setFont('helvetica', 'normal');
    });
    y += 20;
  }
  doc.autoTable({
    head: [head], body, startY: y, margin: { left: M, right: M, top: 18, bottom: 14 }, theme: 'grid',
    styles: { fontSize: 7, cellPadding: 1.4, overflow: 'linebreak', lineColor: [229, 231, 235], lineWidth: .1, textColor: [29, 36, 51] },
    headStyles: { fillColor: [42, 120, 214], textColor: 255, fontStyle: 'bold', fontSize: 7 },
    alternateRowStyles: { fillColor: [250, 251, 253] }, columnStyles: colStyles || {},
    didParseCell: rowStyle, didDrawPage: d => { if (d.pageNumber > 1) header(); },
  });
  const n = doc.internal.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setFontSize(8); doc.setTextColor(140);
    doc.text(`${APP_NAME} — Gestão de Serviços Externos`, M, doc.internal.pageSize.getHeight() - 6);
    doc.text(`Página ${i} de ${n}`, W - M, doc.internal.pageSize.getHeight() - 6, { align: 'right' });
  }
  doc.save(filename);
}

const REC_DATES = [{ v: 'payment', l: 'Data de Pagamento (salva/estimada)' }, { v: 'measurement', l: 'Data de Medição' }, { v: 'completion', l: 'Data de Conclusão Doc.' }];
function recData() {
  const R = ui.rec, today = todayIso();
  const rows = allDocs().filter(x => R.statuses.has(x.d.status) && ['emitido_concluido', 'medido_faturado'].includes(x.d.status)).map(x => {
    const p = paymentInfo(x.s, x.d);
    return { ...x, pay: p.date, est: p.est, ref: x.d.status === 'medido_faturado' ? x.d.measurement_date : (x.d.completion_date || x.s.concluded_date), refEst: x.d.status !== 'medido_faturado', ps: payState(x.d, p.date) };
  }).filter(x => {
    const dv = R.dateField === 'payment' ? x.pay : R.dateField === 'measurement' ? x.d.measurement_date : x.d.completion_date;
    if (R.from && (!dv || dv < R.from)) return false;
    if (R.to && (!dv || dv > R.to)) return false;
    return true;
  }).sort((a, b) => (a.pay || '9999').localeCompare(b.pay || '9999'));
  const sum = arr => arr.reduce((a, x) => a + x.value, 0);
  const med = rows.filter(x => x.d.status === 'medido_faturado');
  return {
    rows, k: {
      total: sum(rows), aReceber: sum(med.filter(x => !x.d.received && x.pay >= today)), medido: sum(med),
      emitido: sum(rows.filter(x => x.d.status === 'emitido_concluido')), atrasado: sum(med.filter(x => !x.d.received && x.pay && x.pay < today)),
    },
  };
}

/* ============================ Financeiro ============================ */
function finData() {
  const today = todayIso(), F = ui.fin;
  const act = allDocs().filter(x => x.d.status !== 'cancelado');
  const pays = act.filter(x => x.d.status === 'medido_faturado').map(x => ({ ...x, pay: paymentInfo(x.s, x.d).date })).filter(x => x.pay).sort((a, b) => a.pay.localeCompare(b.pay));
  const sum = arr => arr.reduce((a, x) => a + x.value, 0);
  const med = act.filter(x => x.d.status === 'medido_faturado');
  const k = {
    receita: sum(act), medido: sum(med), aReceber: sum(med.filter(x => !x.d.received)), recebido: sum(med.filter(x => x.d.received)),
    pendente: sum(pays.filter(x => !x.d.received && x.pay >= today)), atrasado: sum(pays.filter(x => !x.d.received && x.pay < today)),
  };
  let list = pays;
  if (F.period === 'range12') { const t = new Date(); const s0 = iso(t.getFullYear(), t.getMonth() - 6, 1), e0 = iso(t.getFullYear(), t.getMonth() + 7, 0); list = list.filter(x => x.pay >= s0 && x.pay <= e0); }
  else if (F.period !== 'all') list = list.filter(x => x.pay <= addDaysIso(today, F.period));
  if (F.month !== 'all') list = list.filter(x => x.pay.slice(0, 7) === F.month);
  const months = {}; pays.forEach(x => { const m = x.pay.slice(0, 7); months[m] = months[m] || { m, rec: 0, pend: 0 }; months[m][x.d.received ? 'rec' : 'pend'] += x.value; });
  return { k, list, pays, months: Object.values(months).sort((a, b) => a.m.localeCompare(b.m)) };
}

function toggleReceived(key) {
  const { s, d } = findDoc(key);
  if (!d.received) {
    const dt = prompt('Data do recebimento (dd/mm/aaaa):', fmtD(todayIso()));
    if (dt === null) return;
    const mm = dt.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    d.received = true; d.received_date = mm ? `${mm[3]}-${pad(mm[2])}-${pad(mm[1])}` : todayIso();
  } else { d.received = false; d.received_date = ''; }
  touch(s); save(); render();
}

/** Dispara a função online que envia o backup (JSON + Excel) aos usuários cadastrados. */
async function sendBackupEmail(btn) {
  if (!sync.online) return;
  if (!confirm('Enviar agora o backup completo (JSON + Excel) por e-mail para todos os usuários cadastrados?')) return;
  if (sync.dirty || sync.busy) await pushState();
  btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    const { data, error } = await sb.functions.invoke('weekly-backup-email', { body: { origem: 'manual' } });
    let res = data;
    if (error) { try { res = await error.context.json(); } catch { res = { error: error.message }; } }
    if (res?.results) alert(res.results.map(r => `${r.to}: ${r.ok ? 'enviado ✔' : 'ERRO — ' + r.error}`).join('\n'));
    else alert('Erro: ' + (res?.error || 'falha no envio'));
  } catch (e) { alert('Erro: ' + e.message); }
  btn.disabled = false; btn.textContent = '✉ Enviar backup por e-mail agora';
}

  const box = document.getElementById('auto-backups');

  box.innerHTML = data.length ? `<table><thead><tr><th>Data</th><th>Tipo</th><th class="num">Versão</th><th></th></tr></thead><tbody>${data.map(b => `<tr>

}
function stamp() { const t = new Date(); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}_${pad(t.getHours())}${pad(t.getMinutes())}`; }
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function buildBackup() {

    timestamp: new Date().toISOString(), version: '4.0', app: APP_NAME,

    stats: {

      total_value: act.reduce((a, x) => a + x.value, 0), measured_value: act.filter(x => x.d.status === 'medido_faturado').reduce((a, x) => a + x.value, 0),
    },
  };
}
function exportJson() { download(new Blob([JSON.stringify(buildBackup(), null, 2)], { type: 'application/json' }), `backup_servicos_externos_${stamp()}.json`); }
function needXLSX() { if (typeof XLSX === 'undefined') { alert('Biblioteca de Excel não carregou (sem internet?). Use o backup JSON.'); return false; } return true; }
function exportXlsx() {
  if (!needXLSX()) return;
  const wb = XLSX.utils.book_new();
  const servRows = state.services.map(s => ({
    'ID': s.id, 'Nº Projeto': s.project_number, 'Disciplina': s.discipline, 'Nota/OS/SERD': s.parent_project, 'Título': s.title, 'Empresa ID': s.company_id, 'Empresa': s.company_name,
    'Status (resumo)': statusLabel(serviceStatus(s)), 'Dt. Início': s.start_date, 'Dt. Fim Prevista': s.completion_date, 'Dt. Conclusão': s.concluded_date,
    'Avanço (%)': s.progress_percentage, 'Qtd Total': serviceQty(s), 'Valor Total (R$)': serviceValue(s), 'Observações': s.notes, 'Etapas (JSON)': JSON.stringify(s.stages),
    'Criado em': s.created_date, 'Atualizado em': s.updated_date,
  }));
  const docRows = state.services.flatMap(s => s.documents.map(d => ({
    'Serviço ID': s.id, 'Doc ID': d.id, 'Nº Projeto': s.project_number, 'Empresa': s.company_name, 'Nº Documento': d.doc_number, 'Observação': d.note,
    'Tipo': typeInfo(d.type).l, 'Tipo (código)': d.type, 'Quantidade': d.quantity, 'Valor Unit. (R$)': unitValue(companyOf(s), d.type), 'Valor (R$)': docValue(s, d),
    'Status': statusLabel(d.status), 'Status (código)': d.status, 'Dt. Conclusão Doc.': d.completion_date, 'Dt. Medição': d.measurement_date, 'Dt. NF': d.invoice_date, 'Dt. Pagamento': d.payment_date,
    'Recebido': d.received ? 'Sim' : 'Não', 'Dt. Recebimento': d.received_date, 'Início Exec.': d.exec_start, 'Fim Exec.': d.exec_end, 'Prioridade': d.priority ?? '', 'Substatus': d.substatus,
  })));
  const compRows = state.companies.map(c => ({ 'ID': c.id, 'Nome': c.name, 'A1 Básico (R$)': c.a1_basico_value, 'A1 Detalhado (R$)': c.a1_detalhado_value, 'HH Eng. (R$)': c.hh_eng_value, 'HH Proj. (R$)': c.hh_projetista_value, 'Ativa': c.active ? 'Sim' : 'Não', 'Criado em': c.created_date, 'Atualizado em': c.updated_date }));
  const ws = (rows, widths) => { const w = XLSX.utils.json_to_sheet(rows); if (rows.length) w['!cols'] = Object.keys(rows[0]).map(k => ({ wch: widths?.[k] || Math.max(12, k.length + 2) })); return w; };
  XLSX.utils.book_append_sheet(wb, ws(compRows, { 'Nome': 34 }), 'Empresas');
  XLSX.utils.book_append_sheet(wb, ws(state.disciplines.map(d => ({ 'Código': d.code, 'Descrição': d.name })), { 'Descrição': 30 }), 'Disciplinas');
  XLSX.utils.book_append_sheet(wb, ws(servRows, { 'Título': 50, 'Empresa': 26, 'Observações': 30 }), 'Servicos');
  XLSX.utils.book_append_sheet(wb, ws(docRows, { 'Nº Documento': 44, 'Empresa': 26, 'Observação': 30 }), 'Documentos');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ 'Gerado em': new Date().toLocaleString('pt-BR'), 'Versão': '4.0', 'Sistema': APP_NAME }]), 'Info');
  XLSX.writeFile(wb, `backup_servicos_externos_${stamp()}.xlsx`);
}
function replaceState(newState, label) {
  try { localStorage.setItem(PREV_KEY, JSON.stringify(state)); } catch (e) { console.error(e); }
  state = newState; save(); render();
  toast(`${label}: ${state.companies.length} empresas, ${state.services.length} serviços`);
}
function confirmReplace(ns) {
  const nd = ns.services.reduce((a, s) => a + s.documents.length, 0);
  return confirm(`Importar ${ns.companies.length} empresas, ${ns.services.length} serviços e ${nd} documentos?\n\nOs dados atuais (${state.companies.length} empresas, ${state.services.length} serviços) serão SUBSTITUÍDOS. Você poderá desfazer depois.`);
}
function importJsonText(text) {
  const d = JSON.parse(text);
  if (!Array.isArray(d.companies) || !Array.isArray(d.services)) throw new Error('Arquivo não reconhecido: faltam "companies" e "services".');
  const ns = normalizeState(d);
  if (confirmReplace(ns)) replaceState(ns, 'Backup importado');
}
const cellDate = v => {
  if (v == null || v === '') return '';
  if (v instanceof Date) return iso(v.getFullYear(), v.getMonth(), v.getDate());
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  if (typeof v === 'number') { const dt = new Date(Math.round((v - 25569) * 86400000)); return dt.toISOString().slice(0, 10); }
  return '';
};
const parseStatus = v => { if (STATUS.some(s => s.v === v)) return v; const n = norm(v); const hit = STATUS.find(s => norm(s.l) === n) || STATUS.find(s => n && norm(s.l).startsWith(n.split(/[\s/]/)[0])); return hit ? hit.v : 'planejado'; };
const parseType = v => { if (DOC_TYPES.some(t => t.v === v)) return v; const n = norm(v);
  if (n.includes('a1') && n.includes('det')) return 'A1_DETALHADO'; if (n.includes('a1')) return 'A1_BASICO';
  if (n.includes('proj')) return 'HH_PROJ'; return 'HH_ENG'; };
const yes = v => !/^(nao|false|0|n)$/i.test(norm(v));
function importXlsxBuffer(buf) {
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  const sheet = name => { const k = wb.SheetNames.find(n => norm(n) === norm(name)); return k ? XLSX.utils.sheet_to_json(wb.Sheets[k], { defval: '' }) : null; };
  const g = (r, ...keys) => { for (const k of keys) { const hit = Object.keys(r).find(x => norm(x) === norm(k)); if (hit !== undefined && r[hit] !== '') return r[hit]; } return ''; };
  const compRows = sheet('Empresas') || [];
  const companies = compRows.map(r => normalizeCompany({
    id: String(g(r, 'ID') || '') || undefined, name: g(r, 'Nome'), active: yes(g(r, 'Ativa', 'Ativo') || 'Sim'),
    a1_basico_value: g(r, 'A1 Básico (R$)', 'Taxa A1 Básico (R$/prancha)'), a1_detalhado_value: g(r, 'A1 Detalhado (R$)', 'Taxa A1 Detalhado (R$/prancha)'),
    hh_eng_value: g(r, 'HH Eng. (R$)', 'Taxa HH Eng. (R$/h)'), hh_projetista_value: g(r, 'HH Proj. (R$)', 'Taxa HH Proj. (R$/h)'),
    created_date: g(r, 'Criado em') || undefined, updated_date: g(r, 'Atualizado em') || undefined,
  })).filter(c => c.name);
  let services = [];
  const servRows = sheet('Servicos'), docRows = sheet('Documentos');
  if (servRows && docRows && servRows.length && 'ID' in servRows[0]) {
    services = servRows.map(r => {
      let stages; try { stages = JSON.parse(g(r, 'Etapas (JSON)') || 'null'); } catch { stages = null; }
      const id = String(g(r, 'ID'));
      const legacyStatus = g(r, 'Status (código)') || parseStatus(g(r, 'Status (resumo)', 'Status'));
      return {
        id, project_number: String(g(r, 'Nº Projeto')), discipline: String(g(r, 'Disciplina')).toUpperCase(), parent_project: String(g(r, 'Nota/OS/SERD')), title: String(g(r, 'Título')),
        company_id: String(g(r, 'Empresa ID')), company_name: String(g(r, 'Empresa')), status: legacyStatus,
        start_date: cellDate(g(r, 'Dt. Início')), completion_date: cellDate(g(r, 'Dt. Fim Prevista')), concluded_date: cellDate(g(r, 'Dt. Conclusão')),
        measurement_date: cellDate(g(r, 'Dt. Medição')), invoice_date: cellDate(g(r, 'Dt. NF')), payment_date: cellDate(g(r, 'Dt. Pagamento')),
        progress_percentage: g(r, 'Avanço (%)'), notes: String(g(r, 'Observações')), stages,
        created_date: g(r, 'Criado em') || undefined, updated_date: g(r, 'Atualizado em') || undefined,
        documents: docRows.filter(d => String(g(d, 'Serviço ID')) === id).map(d => ({
          id: String(g(d, 'Doc ID')) || undefined, doc_number: String(g(d, 'Nº Documento')), note: String(g(d, 'Observação')), type: g(d, 'Tipo (código)') || parseType(g(d, 'Tipo')),
          quantity: g(d, 'Quantidade'), status: g(d, 'Status (código)') ? g(d, 'Status (código)') : (g(d, 'Status') ? parseStatus(g(d, 'Status')) : undefined),
          completion_date: cellDate(g(d, 'Dt. Conclusão Doc.')), measurement_date: cellDate(g(d, 'Dt. Medição')), invoice_date: cellDate(g(d, 'Dt. NF')), payment_date: cellDate(g(d, 'Dt. Pagamento')),
          measured: norm(g(d, 'Medido')) === 'sim', received: norm(g(d, 'Recebido')) === 'sim', received_date: cellDate(g(d, 'Dt. Recebimento')),
          exec_start: cellDate(g(d, 'Início Exec.')), exec_end: cellDate(g(d, 'Fim Exec.')), priority: g(d, 'Prioridade') === '' ? null : g(d, 'Prioridade'), substatus: String(g(d, 'Substatus')),
        })),
      };
    });
  } else {
    // formato da versão anterior do MGR Projetos: uma linha por documento na aba "Serviços"
    const legacy = sheet('Serviços') || sheet('Servicos') || [];
    const groups = new Map();
    legacy.forEach(r => {
      const key = [g(r, 'Nº Projeto'), g(r, 'Título'), g(r, 'Empresa')].map(norm).join('|');
      if (!groups.has(key)) groups.set(key, {
        project_number: String(g(r, 'Nº Projeto')), title: String(g(r, 'Título')), company_name: String(g(r, 'Empresa')),
        start_date: cellDate(g(r, 'Dt. Início')), progress_percentage: g(r, 'Progresso (%)'), notes: String(g(r, 'Observações')), documents: [],
      });
      const meas = cellDate(g(r, 'Dt. Medição'));
      groups.get(key).documents.push({ doc_number: String(g(r, 'Nº Documento')), type: parseType(g(r, 'Tipo Documento')), quantity: g(r, 'Quantidade'), status: parseStatus(g(r, 'Status')),
        completion_date: cellDate(g(r, 'Dt. Conclusão Doc.')), measurement_date: meas, payment_date: cellDate(g(r, 'Dt. Pagamento')) });
    });
    services = [...groups.values()];
  }
  if (!companies.length && !services.length) throw new Error('Nenhuma aba "Empresas"/"Servicos" reconhecida no arquivo.');
  const disciplines = (sheet('Disciplinas') || []).map(r => ({ code: g(r, 'Código'), name: g(r, 'Descrição') }));
  const ns = normalizeState({ companies, services, disciplines });
  if (confirmReplace(ns)) replaceState(ns, 'Excel importado');
}

/* ============================ Bind geral ============================ */
function bindView() {
  const m = document.getElementById('main');
  m.querySelectorAll('[data-act]').forEach(b => b.onclick = e => {
    e.preventDefault();
    const a = b.dataset.act;
    if (a === 'new-service') { if (!state.companies.length) { alert('Cadastre uma empresa primeiro.'); ui.tab = 'empresas'; return render(); } openService(); }
    if (a === 'go-novalue') { ui.tab = 'servicos'; ui.status.clear(); ui.noValue = true; render(); }
    if (a === 'colmenu') { ui.colMenu = !ui.colMenu; render(); }
    if (a === 'cols-all') { SERVICE_COLS.forEach(c => ui.cols[c.k] = true); saveUi(); render(); }
    if (a === 'cols-def') { SERVICE_COLS.forEach(c => ui.cols[c.k] = c.on); saveUi(); render(); }
    if (a === 'expand-all') { if (ui.expanded.size) ui.expanded.clear(); else filteredServices().forEach(s => ui.expanded.add(s.id)); render(); }
    if (a === 'new-company') openCompany();
    if (a === 'new-disc') { if (addDiscipline()) render(); }
    if (a === 'exp-json') exportJson();
    if (a === 'exp-xlsx') exportXlsx();
    if (a === 'imp-json') m.querySelector('#file-json').click();
    if (a === 'imp-xlsx') { if (needXLSX()) m.querySelector('#file-xlsx').click(); }
    if (a === 'undo-import') { if (confirm('Restaurar os dados de antes da última importação/limpeza?')) { const p = localStorage.getItem(PREV_KEY); state = normalizeState(JSON.parse(p)); localStorage.removeItem(PREV_KEY); save(); render(); toast('Dados restaurados'); } }
    if (a === 'send-backup-email') sendBackupEmail(b);
    if (a === 'wipe') { if (confirm('Apagar TODOS os dados?') && confirm('Tem certeza? Faça um backup antes.')) replaceState(emptyState(), 'Dados apagados'); }
    if (a === 'rep-pdf') exportReportPdf();
    if (a === 'rep-xlsx') exportReportXlsx();
    if (a === 'rep-json') { const { rows, kpis } = reportData(); download(new Blob([JSON.stringify({ gerado_em: new Date().toISOString(), filtros: reportFilterText(), kpis, documentos: rows.map(x => ({ projeto: x.s.project_number, titulo: x.s.title, empresa: x.s.company_name, ...x.d, valor: x.value })) }, null, 2)], { type: 'application/json' }), `relatorio_${stamp()}.json`); }
    if (a === 'r-cleardate') { ui.rep.from = ui.rep.to = ''; render(); }
    if (a === 'rec-pdf') exportRecPdf();
    if (a === 'rec-xlsx') exportRecXlsx();
    if (a === 'fin-pdf') exportFinPdf();
    if (a === 'fin-xlsx') exportFinXlsx();
    if (a === 'fin-clear') { ui.fin = { month: 'all', period: 'all' }; render(); }
    if (a === 'mapa-pdf') exportMapaPdf();
    if (a === 'mapa-clear') { Object.assign(ui.mapa, { search: '', from: '', to: '', statuses: new Set(), types: new Set() }); render(); }
    if (a === 'prio-all') { let p = Math.max(0, ...allDocs().map(x => x.d.priority || 0)); mapaDocs().filter(x => x.d.priority == null).forEach(x => { x.d.priority = ++p; touch(x.s); }); save(); render(); }
  });
  m.querySelectorAll('[data-col]').forEach(c => c.onchange = () => { ui.cols[c.dataset.col] = c.checked; saveUi(); render(); });
  m.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => {
    const c = b.dataset.chip;
    if (c === 'all') { ui.status.clear(); ui.noValue = false; }
    else if (c === 'novalue') ui.noValue = !ui.noValue;
    else ui.status.has(c) ? ui.status.delete(c) : ui.status.add(c);
    render();
  });

  m.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => { const id = b.dataset.toggle; ui.expanded.has(id) ? ui.expanded.delete(id) : ui.expanded.add(id); render(); });
  m.querySelectorAll('[data-edit]').forEach(b => b.onclick = e => { e.preventDefault(); openService(b.dataset.edit); });
  m.querySelectorAll('[data-dup]').forEach(b => b.onclick = () => openService(b.dataset.dup, true));
  m.querySelectorAll('[data-dstatus]').forEach(el => el.onchange = () => { const { s, d } = findDoc(el.dataset.dstatus); setDocStatus(s, d, el.value); });
  m.querySelectorAll('[data-dadv]').forEach(b => b.onclick = () => { const { s, d } = findDoc(b.dataset.dadv); setDocStatus(s, d, FLOW[FLOW.indexOf(d.status) + 1]); });
  m.querySelectorAll('[data-measure]').forEach(b => b.onclick = () => { const { s, d } = findDoc(b.dataset.measure); setDocStatus(s, d, 'medido_faturado'); });
  m.querySelectorAll('[data-measall]').forEach(b => b.onclick = () => {
    const s = state.services.find(x => x.id === b.dataset.measall);
    askMeasurement(s.documents.filter(d => d.status === 'emitido_concluido').map(d => ({ s, d })), ok => { if (ok) { touch(s); save(); toast('Documentos medidos'); } render(); });
  });
  m.querySelectorAll('[data-recv]').forEach(b => b.onclick = () => toggleReceived(b.dataset.recv));
  m.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const s = state.services.find(x => x.id === b.dataset.del);
    if (confirm(`Excluir o serviço ${s.project_number} — ${s.title} (${s.documents.length} documentos)?`)) { state.services = state.services.filter(x => x !== s); save(); render(); }
  });
  m.querySelectorAll('[data-editc]').forEach(b => b.onclick = () => openCompany(b.dataset.editc));
  m.querySelectorAll('[data-delc]').forEach(b => b.onclick = () => deleteCompany(b.dataset.delc));

  m.querySelectorAll('[data-deldisc]').forEach(b => b.onclick = () => deleteDiscipline(b.dataset.deldisc));
  const fj = m.querySelector('#file-json');
  if (fj) fj.onchange = async () => { const f = fj.files[0]; fj.value = ''; if (!f) return; try { importJsonText(await f.text()); } catch (e) { alert('Erro ao importar: ' + e.message); } };
  const fx = m.querySelector('#file-xlsx');

  if (ui.tab === 'mapa') bindMapa(m);
  if (ui.tab === 'relatorios') bindRelatorios(m);
  if (ui.tab === 'recebimentos') bindRecebimentos(m);
  if (ui.tab === 'financeiro') bindFinanceiro(m);

function exportMapaPdf() {
  const docs = mapaDocs(), seq = docs.filter(x => x.d.priority != null).sort((a, b) => a.d.priority - b.d.priority), queue = docs.filter(x => x.d.priority == null);
  const row = (x, i) => [x.d.priority ?? '—', x.s.project_number, x.d.doc_number, x.d.note, x.s.company_name, typeInfo(x.d.type).s, fmtN(x.d.quantity), brl(x.value),
    fmtD(x.d.exec_start || x.s.start_date), fmtD(x.d.exec_end || x.s.completion_date), (SUBSTATUS.find(o => o.v === x.d.substatus) || SUBSTATUS[0]).l, statusLabel(x.d.status), nextStage(x.s)?.name || 'Concluídas'];
  const grp = l => [{ content: l, colSpan: 13, styles: { fillColor: [232, 240, 252], fontStyle: 'bold', textColor: [29, 79, 143] } }];
  pdfDoc({
    title: 'Mapa de Carga', filename: `mapa_de_carga_${stamp()}.pdf`, summary: `${docs.length} documentos | ${seq.length} priorizados | ${queue.length} em fila`,
    kpis: [['Total', docs.length], ['Priorizados', seq.length], ['Em fila', queue.length], ['HH Eng.', fmtN(docs.filter(x => x.d.type === 'HH_ENG').reduce((a, x) => a + num(x.d.quantity), 0))], ['Valor Total', brl(docs.reduce((a, x) => a + x.value, 0))]],
    head: ['#', 'Projeto', 'Documento', 'Observação', 'Empresa', 'Tipo', 'Qtd', 'Valor', 'Início', 'Conclusão', 'Substatus', 'Status', 'Próxima etapa'],
    body: [grp(`Sequência de execução (${seq.length})`), ...seq.map(row), grp(`Fila aguardando priorização (${queue.length})`), ...queue.map(row)],
    colStyles: { 2: { cellWidth: 42 }, 6: { halign: 'right' }, 7: { halign: 'right' } },
  });
}

document.addEventListener('click', e => { if (ui.colMenu && !e.target.closest('.colpick')) { ui.colMenu = false; render(); } });
